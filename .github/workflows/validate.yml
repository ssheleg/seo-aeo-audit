name: validate

on:
  push:
  pull_request:
  # Callable, so `release.yml` gates a publish on THIS suite instead of a
  # copy of it. The negative self-tests live here as steps; running them
  # from the release workflow any other way means a second home per plant.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural validator
        run: python3 test/validate.py
      - name: Negative self-test (sed -i must not come back)
        run: |
          set -eu
          rm -rf /tmp/sedback && cp -R . /tmp/sedback
          python3 - <<'PY'
          # The failure this prevents is invisible on the platform where it happens: a
          # `sed -i` plant is a no-op on macOS, so the guard it was meant to disarm stays
          # armed, the validator honestly passes, and the step blames a healthy guard.
          # Eleven of this workflow's plants were in that state until 2026-08-14.
          p = "/tmp/sedback/.github/workflows/validate.yml"
          s = open(p, encoding="utf-8").read()
          # Search AFTER the plant() definition. The first draft anchored on a literal
          # that this very step also contains, so `replace(..., 1)` rewrote the step's own
          # source text and left every real call intact — a plant planting into itself.
          # rindex, not index, and no anchor literal either: every string this step
          # names also EXISTS in this step, so the first draft rewrote its own source
          # text twice over — a plant planting into itself, once per attempt to fix it.
          # The last occurrence in the file is always a real call site.
          old = "python3 test/plant_edit.py sub"
          i = s.rindex(old)
          s2 = s[:i] + 'sed -i "s/x/y/" #' + s[i + len(old):]
          assert s2 != s, "PLANT DID NOT LAND: no plant_edit call after plant()"
          assert s2.rstrip().endswith(s[i + len(old):].rstrip()), "PLANT DID NOT LAND: the tail moved"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/sedback/test/validate.py; then
            echo "ERROR: validator accepted a sed -i plant that is dead on macOS"
            exit 1
          else
            echo "OK: validator refuses a plant that can only run on one platform"
          fi

      - name: plant_edit refuses by name when its anchor moved
        run: |
          set -eu
          rm -rf /tmp/pe && mkdir -p /tmp/pe && cp test/plant_edit.py /tmp/pe/
          printf 'alpha\nbeta\ngamma\n' > /tmp/pe/f.txt
          cd /tmp/pe
          python3 plant_edit.py sub f.txt beta BETA
          grep -q BETA f.txt || { echo "ERROR: sub did not land"; exit 1; }
          python3 plant_edit.py delline f.txt alpha
          grep -q alpha f.txt && { echo "ERROR: delline did not land"; exit 1; }
          python3 plant_edit.py truncate f.txt gamma
          test "$(cat f.txt)" = "BETA" || { echo "ERROR: truncate did not land"; exit 1; }
          test "$(wc -l < f.txt)" -eq 1 || { echo "ERROR: truncate ate the trailing newline"; exit 1; }
          set +e
          out=$(python3 plant_edit.py sub f.txt "an anchor that moved" x 2>&1); code=$?
          set -e
          # The whole reason this file exists rather than eleven shell quotings: it says
          # WHICH anchor moved, which is a five-minute fix instead of a hunt.
          if [ "$code" != "0" ] && printf '%s' "$out" | grep -q 'PLANT DID NOT LAND'; then
            echo "OK: all three verbs land, and a missing anchor refuses by name"
          else
            echo "ERROR: a missing anchor exited $code — $out"
            exit 1
          fi

      - name: The plant guard itself (content AND mode, and the incident that named it)
        run: python3 test/plant_guard_test.py

      - name: Auditor functional tests
        run: python3 test/test_page_audit.py

      - name: URL Inspection functional tests
        run: python3 test/test_url_inspection.py

      - name: Collector functional tests
        run: python3 test/test_collectors.py

      - name: Agent-surface functional tests
        run: python3 test/test_agent_surface.py

      - name: Cross-script output contracts
        run: python3 test/test_output_contracts.py

      - name: Negative self-test (a run that measured nothing must not exit 0)
        run: |
          set -eu
          rm -rf /tmp/exit-copy && cp -R . /tmp/exit-copy
          python3 - <<'PY'
          p = '/tmp/exit-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/url_inspection.py'
          s = open(p, encoding="utf-8").read()
          old = 'return 0 if answered_rows(rows) else 1'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'return 0', 1))
          PY
          if python3 /tmp/exit-copy/test/test_output_contracts.py; then
            echo "ERROR: tests passed while a run of 403s reported success"
            exit 1
          else
            echo "OK: tests reject success claimed for a run the index never answered"
          fi

      - name: Negative self-test (unflattened error text must fail)
        run: |
          set -eu
          rm -rf /tmp/flat-copy && cp -R . /tmp/flat-copy
          python3 - <<'PY'
          p = '/tmp/flat-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/preflight.py'
          s = open(p, encoding="utf-8").read()
          old = "{_flat(r['detail'])}"
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, "{r['detail']}", 1))
          PY
          if python3 /tmp/flat-copy/test/test_output_contracts.py && \
             python3 /tmp/flat-copy/test/validate.py; then
            echo "ERROR: an API error page reached the table raw and nothing objected"
            exit 1
          else
            echo "OK: a newline in a table cell is caught"
          fi

      - name: Negative self-test (a script path relative to the caller must fail, in each home)
        run: |
          set -eu
          for home in \
            plugins/seo-aeo-audit/skills/seo-aeo-audit/SKILL.md \
            README.md
          do
            rm -rf /tmp/path-copy && cp -R . /tmp/path-copy
            perl -0pi -e 's{python3 "\$SKILL_DIR/scripts/}{python3 "scripts/}' "/tmp/path-copy/$home"
            if python3 /tmp/path-copy/test/validate.py; then
              echo "ERROR: validator accepted an unreachable invocation in $home"
              exit 1
            else
              echo "OK: bare scripts/ paths rejected in $home"
            fi
          done

      - name: Negative self-test (a stale defect count must fail)
        run: |
          set -eu
          rm -rf /tmp/count-copy && cp -R . /tmp/count-copy
          python3 - <<'PY'
          p = '/tmp/count-copy/docs/evidence/retro.md'
          s = open(p, encoding="utf-8").read()
          old = 'exited 0 against forty-three defects'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'exited 0 against forty-one defects', 1))
          PY
          if python3 /tmp/count-copy/test/validate.py; then
            echo "ERROR: validator accepted a defect count the ledger contradicts"
            exit 1
          else
            echo "OK: the count is reconciled against the ledger's own rows"
          fi

      - name: Negative self-test (lab score must never stand in for field data)
        run: |
          set -eu
          cp -R . /tmp/psi-copy
          python3 - <<'PY'
          p = '/tmp/psi-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/psi_pull.py'
          s = open(p, encoding="utf-8").read()
          old = '"field_data": field or None,'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, '"field_data": field or {"LCP": {"p75": 0, "unit": "ms", "band": "good", "good_at_or_below": 2500, "poor_above": 4000}},', 1))
          PY
          if python3 /tmp/psi-copy/test/test_collectors.py; then
            echo "ERROR: tests passed while absent CrUX data was reported as a pass"
            exit 1
          else
            echo "OK: tests reject absence dressed up as a measurement"
          fi

      - name: Negative self-test (the wrong canonical field name must fail)
        run: |
          set -eu
          cp -R . /tmp/canon-copy
          python3 - <<'PY'
          p = '/tmp/canon-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/url_inspection.py'
          s = open(p, encoding="utf-8").read()
          old = 'idx.get("userCanonical")'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'idx.get("userDeclaredCanonical")', 1))
          PY
          if python3 /tmp/canon-copy/test/test_url_inspection.py; then
            echo "ERROR: tests passed while reading a field the API does not return"
            exit 1
          else
            echo "OK: tests catch the userDeclaredCanonical mis-spelling"
          fi

      - name: Negative self-test (robots Allow precedence must fail if dropped)
        run: |
          set -eu
          rm -rf /tmp/robots-copy && cp -R . /tmp/robots-copy
          python3 - <<'PY'
          p = '/tmp/robots-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '            if n > best_len:'
          assert old in s, "PLANT DID NOT LAND: the precedence comparison is not where this plant reads it"
          # Disallow now wins every tie AND every equal-length match: the exact
          # shape that reported a permitted /api as forbidden.
          open(p, "w", encoding="utf-8").write(s.replace(old, '            if n >= best_len:', 1))
          PY
          if python3 /tmp/robots-copy/test/test_agent_surface.py; then
            echo "ERROR: a path the site explicitly Allows passed as forbidden"
            exit 1
          else
            echo "OK: the most specific rule wins and Allow breaks the tie"
          fi

      - name: Negative self-test (a redirect credited as the page asked for must fail)
        run: |
          set -eu
          rm -rf /tmp/redir-copy && cp -R . /tmp/redir-copy
          python3 - <<'PY'
          p = '/tmp/redir-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '    return "root" if fin == "/" else "elsewhere"'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, '    return "same"', 1))
          PY
          if python3 /tmp/redir-copy/test/test_agent_surface.py; then
            echo "ERROR: a 301 to the homepage passed as the page that was requested"
            exit 1
          else
            echo "OK: a redirect is not the page you asked for"
          fi

      - name: Negative self-test (HTML comments counted as visible prose must fail)
        run: |
          set -eu
          rm -rf /tmp/cmt-copy && cp -R . /tmp/cmt-copy
          python3 - <<'PY'
          p = '/tmp/cmt-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '    body = re.sub(r"<!--.*?-->", " ", body, flags=re.S)\n'
          assert old in s, "PLANT DID NOT LAND: the comment stripper is not where this plant reads it"
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          PY
          if python3 /tmp/cmt-copy/test/test_agent_surface.py; then
            echo "ERROR: a trust page graded on the length of its HTML comments"
            exit 1
          else
            echo "OK: comments are not prose"
          fi

      - name: Negative self-test (presence dressed up as effect must fail)
        run: |
          set -eu
          rm -rf /tmp/tier-copy && cp -R . /tmp/tier-copy
          python3 - <<'PY'
          p = '/tmp/tier-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '"wellknown-absent": "HYPOTHESIS",'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, '"wellknown-absent": "CONFIRMED",', 1))
          PY
          if python3 /tmp/tier-copy/test/test_agent_surface.py; then
            echo "ERROR: a draft spec's absence passed as a CONFIRMED defect"
            exit 1
          else
            echo "OK: presence is not effect, and the suite says so"
          fi

      - name: Negative self-test (a finding with no declared tier must fail)
        run: |
          set -eu
          rm -rf /tmp/notier-copy && cp -R . /tmp/notier-copy
          python3 - <<'PY'
          p = '/tmp/notier-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '    "openapi-batch": "STUDY",\n'
          assert old in s, "PLANT DID NOT LAND: openapi-batch tier not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          PY
          if python3 /tmp/notier-copy/test/validate.py && \
             python3 /tmp/notier-copy/test/test_agent_surface.py; then
            echo "ERROR: a finding shipped with no entry in FINDING_TIERS"
            exit 1
          else
            echo "OK: the tier-coverage guard reads the second emitter shape too"
          fi

      - name: Negative self-test (dropping the blindness caveat must fail)
        run: |
          set -eu
          cp -R . /tmp/caveat-copy
          python3 - <<'PY'
          p = '/tmp/caveat-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/page_audit.py'
          s = open(p, encoding="utf-8").read()
          old = 'server-rendered HTML only'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'redacted', 1))
          PY
          if python3 /tmp/caveat-copy/test/validate.py; then
            echo "ERROR: validator accepted a page_audit with no blindness caveat"
            exit 1
          else
            echo "OK: validator rejects a silent instrument"
          fi

      - name: Negative self-test (Cursor doctrine drift must fail)
        run: |
          set -eu
          cp -R . /tmp/cursor-copy
          # drop one non-negotiable from the Cursor channel only
          python3 - <<'PY'
          import re
          p = "/tmp/cursor-copy/cursor/rules/seo-aeo-audit.mdc"
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn(r"\n8\. \*\*Know each instrument's blind spot.*?(?=\n## )", "\n", s, flags=re.S)
          assert n == 1, "PLANT DID NOT LAND: non-negotiable 8 is not where this plant reads it"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/cursor-copy/test/validate.py; then
            echo "ERROR: validator accepted a Cursor rule missing a non-negotiable"
            exit 1
          else
            echo "OK: validator catches doctrine drift between channels"
          fi

      - name: Negative self-test (version drift must fail)
        run: |
          set -eu
          cp -R . /tmp/corrupt-copy
          python3 - <<'PY'
          import re
          p = '/tmp/corrupt-copy/plugins/seo-aeo-audit/.claude-plugin/plugin.json'
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn('"version": "[0-9.]*"', '"version": "0.0.0-corrupt"', s, count=1, flags=re.M)
          assert n == 1, "PLANT DID NOT LAND: pattern not found in " + p
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/corrupt-copy/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy — it cannot fail"
            exit 1
          else
            echo "OK: validator correctly FAILs on version drift"
          fi

      - name: Negative self-test (missing reference must fail)
        run: |
          set -eu
          cp -R . /tmp/noref-copy
          rm -f /tmp/noref-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/references/myths.md
          if python3 /tmp/noref-copy/test/validate.py; then
            echo "ERROR: validator passed with a contract file missing"
            exit 1
          else
            echo "OK: validator requires the reference contracts"
          fi

      - name: Negative self-test (the Discover reference is a contract, not a file)
        run: |
          set -eu
          cp -R . /tmp/nodiscover-copy
          rm -f /tmp/nodiscover-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/references/discover.md
          if python3 /tmp/nodiscover-copy/test/validate.py; then
            echo "ERROR: validator passed with the Discover track missing"
            exit 1
          else
            echo "OK: discover.md is required, not optional"
          fi

      - name: Negative self-test (stray SKILL.md must fail)
        run: |
          set -eu
          cp -R . /tmp/stray-copy
          cp /tmp/stray-copy/templates/audit-report.template.md /tmp/stray-copy/templates/SKILL.md
          if python3 /tmp/stray-copy/test/validate.py; then
            echo "ERROR: validator passed with a stray SKILL.md outside plugins/*/skills/*/"
            exit 1
          else
            echo "OK: validator rejects stray SKILL.md"
          fi

      - name: Negative self-test (auditor tests must be able to fail)
        run: |
          set -eu
          cp -R . /tmp/badscript-copy
          python3 - <<'PY'
          p = '/tmp/badscript-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/page_audit.py'
          s = open(p, encoding="utf-8").read()
          old = 'if r["noindex"]:'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'if False:', 1))
          PY
          if python3 /tmp/badscript-copy/test/test_page_audit.py; then
            echo "ERROR: auditor tests passed with the noindex check disabled"
            exit 1
          else
            echo "OK: auditor tests catch a broken check"
          fi

      - name: Negative self-test (renamed heading must break the auditor's anchors)
        run: |
          set -eu
          cp -R . /tmp/anchor-copy
          python3 - <<'PY'
          import re
          p = '/tmp/anchor-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/references/architecture-and-equity.md'
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn('^## Read-budget: navigation now costs you twice$', '## Read budget', s, count=1, flags=re.M)
          assert n == 1, "PLANT DID NOT LAND: pattern not found in " + p
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if python3 /tmp/anchor-copy/test/validate.py; then
            echo "ERROR: validator passed while page_audit.py points at a renamed heading"
            exit 1
          else
            echo "OK: validator catches a dangling finding anchor"
          fi

      - name: Negative self-test (bytecode in the shipped tree must fail)
        run: |
          set -eu
          cp -R . /tmp/pyc-copy
          mkdir -p /tmp/pyc-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/__pycache__
          touch /tmp/pyc-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/__pycache__/x.cpython-312.pyc
          if python3 /tmp/pyc-copy/test/validate.py; then
            echo "ERROR: validator passed with __pycache__ inside plugins/ — v0.7.0 shipped exactly that"
            exit 1
          else
            echo "OK: validator refuses build artifacts in the shipped tree"
          fi

      - name: Negative self-test (template drift must fail)
        run: |
          set -eu
          cp -R . /tmp/drift-copy
          printf '\n## injected drift\n' >> /tmp/drift-copy/templates/audit-report.template.md
          if python3 /tmp/drift-copy/test/validate.py; then
            echo "ERROR: validator passed with the root template drifted from the shipped copy"
            exit 1
          else
            echo "OK: validator catches template drift"
          fi

      - name: Negative self-tests for the reconciliation guards
        run: |
          set -eu
          S=plugins/seo-aeo-audit/skills/seo-aeo-audit
          # Each row plants one defect the guard exists for and requires a non-zero
          # exit. A guard nobody has watched fail is indistinguishable from a guard
          # that cannot — and the 2026-08-10 audit found guards written against one
          # home of a fact that lived in four, all of them green.
          plant() {
            desc="$1"; shift
            rm -rf /tmp/neg && cp -R . /tmp/neg
            python3 test/plant_guard.py snap /tmp/neg
            ( cd /tmp/neg && "$@" )
            # Instruction #6's corollary, once for every call site. The comparison is
            # `test/plant_guard.py`, not an inline `diff`: five hand-written variants of
            # this check produced five different bugs, one of them a content-only
            # comparison against a plant whose whole effect is `chmod`.
            python3 test/plant_guard.py verify /tmp/neg "$desc"
            if python3 /tmp/neg/test/validate.py >/dev/null 2>&1; then
              echo "BROKEN GUARD: $desc — validator still passes"; exit 1
            fi
            echo "ok: $desc"
          }
          # These two plants name the current myth count, which makes this file a
          # fifth home for it beside myths.md, README, SKILL.md and the Cursor
          # rule. Adding row 33 in v0.19.0 stopped both plants landing, and
          # plant_guard refused rather than reporting a pass — which is the guard
          # working, and also the reminder: bump the numbers here in the same
          # commit that adds a myth row.
          plant "myth count drifting in SKILL.md (not the README home)" \
            python3 test/plant_edit.py sub "$S/SKILL.md" "most-requested of the **33**" "most-requested of the **30**"
          plant "myth count drifting in the Cursor channel" \
            python3 test/plant_edit.py sub cursor/rules/seo-aeo-audit.mdc "out of 33 refuted claims" "out of 29 refuted claims"
          plant "the two myth short lists disagreeing in size" \
            python3 -c "p='cursor/rules/seo-aeo-audit.mdc';s=open(p,encoding='utf-8').read();assert 'The fourteen asked for most often' in s,'PLANT DID NOT LAND: '+p;open(p,'w',encoding='utf-8').write(s.replace('The fourteen asked for most often','The thirteen asked for most often',1))"
          plant "play count drifting from the table" \
            python3 test/plant_edit.py sub README.md "| **Growth plays** | 61 plays" "| **Growth plays** | 60 plays"
          plant "the Prowl tool count disagreeing across homes" \
            python3 test/plant_edit.py sub README.md "~448 provider tools" "~408 provider tools"
          plant "a table row with more cells than its header" \
            python3 -c "import re,io;p='plugins/seo-aeo-audit/skills/seo-aeo-audit/references/growth-plays.md';s=open(p,encoding='utf-8').read();s2,n=re.subn('^| B1 | Manual action present |','| B1 | Manual action present | extra |',s,count=1,flags=re.M);assert n==1,'PLANT DID NOT LAND: '+p;open(p,'w',encoding='utf-8').write(s2)"
          plant "CONTRIBUTING naming a subset of the gate" \
            python3 test/plant_edit.py delline CONTRIBUTING.md "python3 test/test_collectors.py"
          plant "a section id defined in two references" \
            python3 test/plant_edit.py sub "$S/references/onpage-checks.md" "## O1. Can crawlers" "## D1. Can crawlers"
          plant "a row appended without moving the newest-row line" \
            python3 -c "import re;p='plugins/seo-aeo-audit/skills/seo-aeo-audit/references/algorithm-updates.md';s=open(p,encoding='utf-8').read();s2,n=re.subn(r'(\*\*Newest row in this file:\s*)20\d\d-\d\d-\d\d',r'\g<1>2000-01-01',s,count=1);assert n==1,'PLANT DID NOT LAND: '+p;open(p,'w',encoding='utf-8').write(s2)"
          plant "a finding emitted with no evidence tier" \
            python3 test/plant_edit.py sub "$S/scripts/page_audit.py" '    "truncated-read": "CONFIRMED",' ""
          plant "the CWV thresholds drifting from their documented home" \
            python3 test/plant_edit.py sub "$S/scripts/psi_pull.py" '("LCP", 2500, 4000' '("LCP", 2000, 4000'
          plant "a backticked references/ pointer resolving to nothing" \
            python3 test/plant_edit.py sub "$S/references/linkbuilding.md" '`references/myths.md`' '`references/mythz.md`'
          plant "a prose reference count going stale" \
            python3 test/plant_edit.py sub CONTRIBUTING.md "mostly **knowledge** — twenty-three" "mostly **knowledge** — twenty-two"
          plant "the slash command losing a non-negotiable" \
            python3 test/plant_edit.py truncate plugins/seo-aeo-audit/commands/seo-aeo-audit.md "8. **Know each instrument"

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: npm installer CLI check
        run: node --check bin/seo-aeo-audit.js

      - name: npm installer functional test (fresh / rerun-skip / --force)
        run: |
          set -eu
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          node bin/seo-aeo-audit.js
          test -f "$HOME/.claude/skills/seo-aeo-audit/SKILL.md"
          test -f "$HOME/.claude/skills/seo-aeo-audit/references/myths.md"
          test -f "$HOME/.claude/skills/seo-aeo-audit/references/deliverable-templates.md"
          test -f "$HOME/.claude/skills/seo-aeo-audit/scripts/page_audit.py"
          test -f "$HOME/.claude/commands/seo-aeo-audit.md"
          node bin/seo-aeo-audit.js | grep -q '^skip:'
          node bin/seo-aeo-audit.js --force | grep -q '^Installed'
          if node bin/seo-aeo-audit.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          echo "OK: npm installer behaves"

      - name: Workflow YAML parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/validate.yml')); print('workflow parses OK')"
      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          # The repo's own validator enforces house rules; this one is the
          # upstream spec. --strict fails on unrecognized manifest fields and on
          # front matter that silently drops at runtime -- both were real here.
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/seo-aeo-audit --strict
