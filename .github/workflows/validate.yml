name: validate

on:
  push:
    # A TAG push must not start this workflow. `release.yml` calls it through
    # `workflow_call`, and both runs land in the same concurrency group
    # (`validate-${{ github.ref }}`) — so the push-triggered one cancels the
    # release's own call, `release` and `publish` are SKIPPED for a `needs:` that
    # was cancelled rather than failed, and the tag ships nothing while the run
    # list shows a green validate beside it. Measured 2026-08-20 on
    # `agent-stack v0.13.0`: validate green, release cancelled at 2s, npm still
    # serving the previous version. It is a race, which is why the two siblings
    # with the same shape happened to publish.
    tags-ignore: ['**']
  pull_request:
  # Callable, so `release.yml` gates a publish on THIS suite instead of a
  # copy of it. The negative self-tests live here as steps; running them
  # from the release workflow any other way means a second home per plant.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Structural validator
        run: python3 test/validate.py
      - name: Negative self-test (sed -i must not come back)
        run: |
          set -eu
          rm -rf /tmp/sedback /tmp/sedback-residue && cp -R . /tmp/sedback && mkdir -p /tmp/sedback-residue
          python3 - <<'PY'
          import re
          # The failure this prevents is invisible on the platform where it happens: a
          # `sed -i` plant is a no-op on macOS, so the guard it was meant to disarm stays
          # armed, the validator honestly passes, and the step blames a healthy guard.
          # Eleven of this workflow's plants were in that state until 2026-08-14.
          p = "/tmp/sedback/.github/workflows/validate.yml"
          s = open(p, encoding="utf-8").read()
          # Search AFTER the plant() definition. The first draft anchored on a literal
          # that this very step also contains, so `replace(..., 1)` rewrote the step's own
          # source text and left every real call intact — a plant planting into itself.
          # rindex, not index, and no anchor literal either: every string this step
          # names also EXISTS in this step, so the first draft rewrote its own source
          # text twice over — a plant planting into itself, once per attempt to fix it.
          # The last LINE-INITIAL occurrence: "the last occurrence" stopped being a
          # call site in command position on 2026-08-19, when a plant's `sub` moved
          # inside a `for … ; do …; done` — the plant then landed in a place the guard
          # did not read, and the step blamed a healthy guard. The guard was widened to
          # cover `do`/`then`/`else` as well; this anchor states what the step needs.
          old = "python3 test/plant_edit.py sub"
          i = max(m.start(1) for m in re.finditer(r"^\s*(" + re.escape(old) + r")", s, re.M))
          s2 = s[:i] + 'sed -i "s/x/y/" #' + s[i + len(old):]
          assert s2 != s, "PLANT DID NOT LAND: no plant_edit call after plant()"
          assert s2.rstrip().endswith(s[i + len(old):].rstrip()), "PLANT DID NOT LAND: the tail moved"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if TMPDIR=/tmp/sedback-residue python3 /tmp/sedback/test/validate.py; then
            echo "ERROR: validator accepted a sed -i plant that is dead on macOS"
            exit 1
          else
            echo "OK: validator refuses a plant that can only run on one platform"
          fi

      - name: plant_edit refuses by name when its anchor moved
        run: |
          set -eu
          rm -rf /tmp/pe && mkdir -p /tmp/pe && cp test/plant_edit.py /tmp/pe/
          printf 'alpha\nbeta\ngamma\n' > /tmp/pe/f.txt
          cd /tmp/pe
          python3 plant_edit.py sub f.txt beta BETA
          grep -q BETA f.txt || { echo "ERROR: sub did not land"; exit 1; }
          python3 plant_edit.py delline f.txt alpha
          grep -q alpha f.txt && { echo "ERROR: delline did not land"; exit 1; }
          python3 plant_edit.py truncate f.txt gamma
          test "$(cat f.txt)" = "BETA" || { echo "ERROR: truncate did not land"; exit 1; }
          test "$(wc -l < f.txt)" -eq 1 || { echo "ERROR: truncate ate the trailing newline"; exit 1; }
          set +e
          out=$(python3 plant_edit.py sub f.txt "an anchor that moved" x 2>&1); code=$?
          set -e
          # The whole reason this file exists rather than eleven shell quotings: it says
          # WHICH anchor moved, which is a five-minute fix instead of a hunt.
          if [ "$code" != "0" ] && printf '%s' "$out" | grep -q 'PLANT DID NOT LAND'; then
            echo "OK: all three verbs land, and a missing anchor refuses by name"
          else
            echo "ERROR: a missing anchor exited $code — $out"
            exit 1
          fi

      - name: The plant guard itself (content AND mode, and the incident that named it)
        run: python3 test/plant_guard_test.py

      - name: Auditor functional tests
        run: python3 test/test_page_audit.py

      - name: URL Inspection functional tests
        run: python3 test/test_url_inspection.py

      - name: Collector functional tests
        run: python3 test/test_collectors.py

      - name: Agent-surface functional tests
        run: python3 test/test_agent_surface.py

      - name: Cross-script output contracts
        run: python3 test/test_output_contracts.py

      - name: What the run left on disk (and that it said so)
        run: python3 test/residue_test.py

      - name: Negative self-test (a run that measured nothing must not exit 0)
        run: |
          set -eu
          rm -rf /tmp/exit-copy /tmp/exit-copy-residue && cp -R . /tmp/exit-copy && mkdir -p /tmp/exit-copy-residue
          python3 - <<'PY'
          p = '/tmp/exit-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/url_inspection.py'
          s = open(p, encoding="utf-8").read()
          old = 'return 0 if answered_rows(rows) else 1'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'return 0', 1))
          PY
          if TMPDIR=/tmp/exit-copy-residue python3 /tmp/exit-copy/test/test_output_contracts.py; then
            echo "ERROR: tests passed while a run of 403s reported success"
            exit 1
          else
            echo "OK: tests reject success claimed for a run the index never answered"
          fi

      - name: Negative self-test (unflattened error text must fail)
        run: |
          set -eu
          rm -rf /tmp/flat-copy /tmp/flat-copy-residue && cp -R . /tmp/flat-copy && mkdir -p /tmp/flat-copy-residue
          python3 - <<'PY'
          p = '/tmp/flat-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/preflight.py'
          s = open(p, encoding="utf-8").read()
          old = "{_flat(r['detail'])}"
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, "{r['detail']}", 1))
          PY
          if TMPDIR=/tmp/flat-copy-residue python3 /tmp/flat-copy/test/test_output_contracts.py && \
             TMPDIR=/tmp/flat-copy-residue python3 /tmp/flat-copy/test/validate.py; then
            echo "ERROR: an API error page reached the table raw and nothing objected"
            exit 1
          else
            echo "OK: a newline in a table cell is caught"
          fi

      - name: Negative self-test (a script path relative to the caller must fail, in each home)
        run: |
          set -eu
          for home in \
            plugins/seo-aeo-audit/skills/seo-aeo-audit/SKILL.md \
            plugins/seo-aeo-audit/skills/seo-aeo-audit/references/scripts.md \
            README.md
          do
            rm -rf /tmp/path-copy /tmp/path-copy-residue && cp -R . /tmp/path-copy && mkdir -p /tmp/path-copy-residue
            perl -0pi -e 's{python3 "\$SKILL_DIR/scripts/}{python3 "scripts/}' "/tmp/path-copy/$home"
            if TMPDIR=/tmp/path-copy-residue python3 /tmp/path-copy/test/validate.py; then
              echo "ERROR: validator accepted an unreachable invocation in $home"
              exit 1
            else
              echo "OK: bare scripts/ paths rejected in $home"
            fi
          done

      - name: Negative self-test (a stale defect count must fail)
        run: |
          set -eu
          rm -rf /tmp/count-copy /tmp/count-copy-residue && cp -R . /tmp/count-copy && mkdir -p /tmp/count-copy-residue
          python3 - <<'PY'
          p = '/tmp/count-copy/docs/evidence/retro.md'
          s = open(p, encoding="utf-8").read()
          old = 'exited 0 against forty-three defects'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'exited 0 against forty-one defects', 1))
          PY
          if TMPDIR=/tmp/count-copy-residue python3 /tmp/count-copy/test/validate.py; then
            echo "ERROR: validator accepted a defect count the ledger contradicts"
            exit 1
          else
            echo "OK: the count is reconciled against the ledger's own rows"
          fi

      - name: Negative self-test (lab score must never stand in for field data)
        run: |
          set -eu
          cp -R . /tmp/psi-copy && mkdir -p /tmp/psi-copy-residue
          python3 - <<'PY'
          p = '/tmp/psi-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/psi_pull.py'
          s = open(p, encoding="utf-8").read()
          old = '"field_data": field or None,'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, '"field_data": field or {"LCP": {"p75": 0, "unit": "ms", "band": "good", "good_at_or_below": 2500, "poor_above": 4000}},', 1))
          PY
          if TMPDIR=/tmp/psi-copy-residue python3 /tmp/psi-copy/test/test_collectors.py; then
            echo "ERROR: tests passed while absent CrUX data was reported as a pass"
            exit 1
          else
            echo "OK: tests reject absence dressed up as a measurement"
          fi

      - name: Negative self-test (the wrong canonical field name must fail)
        run: |
          set -eu
          cp -R . /tmp/canon-copy && mkdir -p /tmp/canon-copy-residue
          python3 - <<'PY'
          p = '/tmp/canon-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/url_inspection.py'
          s = open(p, encoding="utf-8").read()
          old = 'idx.get("userCanonical")'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'idx.get("userDeclaredCanonical")', 1))
          PY
          if TMPDIR=/tmp/canon-copy-residue python3 /tmp/canon-copy/test/test_url_inspection.py; then
            echo "ERROR: tests passed while reading a field the API does not return"
            exit 1
          else
            echo "OK: tests catch the userDeclaredCanonical mis-spelling"
          fi

      - name: Negative self-test (robots Allow precedence must fail if dropped)
        run: |
          set -eu
          rm -rf /tmp/robots-copy /tmp/robots-copy-residue && cp -R . /tmp/robots-copy && mkdir -p /tmp/robots-copy-residue
          python3 - <<'PY'
          p = '/tmp/robots-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '            if n > best_len:'
          assert old in s, "PLANT DID NOT LAND: the precedence comparison is not where this plant reads it"
          # Disallow now wins every tie AND every equal-length match: the exact
          # shape that reported a permitted /api as forbidden.
          open(p, "w", encoding="utf-8").write(s.replace(old, '            if n >= best_len:', 1))
          PY
          if TMPDIR=/tmp/robots-copy-residue python3 /tmp/robots-copy/test/test_agent_surface.py; then
            echo "ERROR: a path the site explicitly Allows passed as forbidden"
            exit 1
          else
            echo "OK: the most specific rule wins and Allow breaks the tie"
          fi

      - name: Negative self-test (a redirect credited as the page asked for must fail)
        run: |
          set -eu
          rm -rf /tmp/redir-copy /tmp/redir-copy-residue && cp -R . /tmp/redir-copy && mkdir -p /tmp/redir-copy-residue
          python3 - <<'PY'
          p = '/tmp/redir-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '    return "root" if fin == "/" else "elsewhere"'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, '    return "same"', 1))
          PY
          if TMPDIR=/tmp/redir-copy-residue python3 /tmp/redir-copy/test/test_agent_surface.py; then
            echo "ERROR: a 301 to the homepage passed as the page that was requested"
            exit 1
          else
            echo "OK: a redirect is not the page you asked for"
          fi

      - name: Negative self-test (HTML comments counted as visible prose must fail)
        run: |
          set -eu
          rm -rf /tmp/cmt-copy /tmp/cmt-copy-residue && cp -R . /tmp/cmt-copy && mkdir -p /tmp/cmt-copy-residue
          python3 - <<'PY'
          p = '/tmp/cmt-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '    body = re.sub(r"<!--.*?-->", " ", body, flags=re.S)\n'
          assert old in s, "PLANT DID NOT LAND: the comment stripper is not where this plant reads it"
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          PY
          if TMPDIR=/tmp/cmt-copy-residue python3 /tmp/cmt-copy/test/test_agent_surface.py; then
            echo "ERROR: a trust page graded on the length of its HTML comments"
            exit 1
          else
            echo "OK: comments are not prose"
          fi

      - name: Negative self-test (presence dressed up as effect must fail)
        run: |
          set -eu
          rm -rf /tmp/tier-copy /tmp/tier-copy-residue && cp -R . /tmp/tier-copy && mkdir -p /tmp/tier-copy-residue
          python3 - <<'PY'
          p = '/tmp/tier-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '"wellknown-absent": "HYPOTHESIS",'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, '"wellknown-absent": "CONFIRMED",', 1))
          PY
          if TMPDIR=/tmp/tier-copy-residue python3 /tmp/tier-copy/test/test_agent_surface.py; then
            echo "ERROR: a draft spec's absence passed as a CONFIRMED defect"
            exit 1
          else
            echo "OK: presence is not effect, and the suite says so"
          fi

      - name: Negative self-test (a finding with no declared tier must fail)
        run: |
          set -eu
          rm -rf /tmp/notier-copy /tmp/notier-copy-residue && cp -R . /tmp/notier-copy && mkdir -p /tmp/notier-copy-residue
          python3 - <<'PY'
          p = '/tmp/notier-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/agent_surface.py'
          s = open(p, encoding="utf-8").read()
          old = '    "openapi-batch": "STUDY",\n'
          assert old in s, "PLANT DID NOT LAND: openapi-batch tier not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, "", 1))
          PY
          if TMPDIR=/tmp/notier-copy-residue python3 /tmp/notier-copy/test/validate.py && \
             TMPDIR=/tmp/notier-copy-residue python3 /tmp/notier-copy/test/test_agent_surface.py; then
            echo "ERROR: a finding shipped with no entry in FINDING_TIERS"
            exit 1
          else
            echo "OK: the tier-coverage guard reads the second emitter shape too"
          fi

      - name: Negative self-test (dropping the blindness caveat must fail)
        run: |
          set -eu
          cp -R . /tmp/caveat-copy && mkdir -p /tmp/caveat-copy-residue
          python3 - <<'PY'
          p = '/tmp/caveat-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/page_audit.py'
          s = open(p, encoding="utf-8").read()
          old = 'server-rendered HTML only'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'redacted', 1))
          PY
          if TMPDIR=/tmp/caveat-copy-residue python3 /tmp/caveat-copy/test/validate.py; then
            echo "ERROR: validator accepted a page_audit with no blindness caveat"
            exit 1
          else
            echo "OK: validator rejects a silent instrument"
          fi

      - name: Negative self-test (Cursor doctrine drift must fail)
        run: |
          set -eu
          cp -R . /tmp/cursor-copy && mkdir -p /tmp/cursor-copy-residue
          # drop one non-negotiable from the Cursor channel only
          python3 - <<'PY'
          import re
          p = "/tmp/cursor-copy/cursor/rules/seo-aeo-audit.mdc"
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn(r"\n8\. \*\*Know each instrument's blind spot.*?(?=\n## )", "\n", s, flags=re.S)
          assert n == 1, "PLANT DID NOT LAND: non-negotiable 8 is not where this plant reads it"
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if TMPDIR=/tmp/cursor-copy-residue python3 /tmp/cursor-copy/test/validate.py; then
            echo "ERROR: validator accepted a Cursor rule missing a non-negotiable"
            exit 1
          else
            echo "OK: validator catches doctrine drift between channels"
          fi

      - name: Negative self-test (version drift must fail)
        run: |
          set -eu
          cp -R . /tmp/corrupt-copy && mkdir -p /tmp/corrupt-copy-residue
          python3 - <<'PY'
          import re
          p = '/tmp/corrupt-copy/plugins/seo-aeo-audit/.claude-plugin/plugin.json'
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn('"version": "[0-9.]*"', '"version": "0.0.0-corrupt"', s, count=1, flags=re.M)
          assert n == 1, "PLANT DID NOT LAND: pattern not found in " + p
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if TMPDIR=/tmp/corrupt-copy-residue python3 /tmp/corrupt-copy/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy — it cannot fail"
            exit 1
          else
            echo "OK: validator correctly FAILs on version drift"
          fi

      - name: Negative self-test (missing reference must fail)
        run: |
          set -eu
          cp -R . /tmp/noref-copy && mkdir -p /tmp/noref-copy-residue
          rm -f /tmp/noref-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/references/myths.md
          if TMPDIR=/tmp/noref-copy-residue python3 /tmp/noref-copy/test/validate.py; then
            echo "ERROR: validator passed with a contract file missing"
            exit 1
          else
            echo "OK: validator requires the reference contracts"
          fi

      - name: Negative self-test (the Discover reference is a contract, not a file)
        run: |
          set -eu
          cp -R . /tmp/nodiscover-copy && mkdir -p /tmp/nodiscover-copy-residue
          rm -f /tmp/nodiscover-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/references/discover.md
          if TMPDIR=/tmp/nodiscover-copy-residue python3 /tmp/nodiscover-copy/test/validate.py; then
            echo "ERROR: validator passed with the Discover track missing"
            exit 1
          else
            echo "OK: discover.md is required, not optional"
          fi

      - name: Negative self-test (stray SKILL.md must fail)
        run: |
          set -eu
          cp -R . /tmp/stray-copy && mkdir -p /tmp/stray-copy-residue
          cp /tmp/stray-copy/templates/audit-report.template.md /tmp/stray-copy/templates/SKILL.md
          if TMPDIR=/tmp/stray-copy-residue python3 /tmp/stray-copy/test/validate.py; then
            echo "ERROR: validator passed with a stray SKILL.md outside plugins/*/skills/*/"
            exit 1
          else
            echo "OK: validator rejects stray SKILL.md"
          fi

      - name: Negative self-test (auditor tests must be able to fail)
        run: |
          set -eu
          cp -R . /tmp/badscript-copy && mkdir -p /tmp/badscript-copy-residue
          python3 - <<'PY'
          p = '/tmp/badscript-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/page_audit.py'
          s = open(p, encoding="utf-8").read()
          old = 'if r["noindex"]:'
          assert old in s, "PLANT DID NOT LAND: " + old[:40] + " not in " + p
          open(p, "w", encoding="utf-8").write(s.replace(old, 'if False:', 1))
          PY
          if TMPDIR=/tmp/badscript-copy-residue python3 /tmp/badscript-copy/test/test_page_audit.py; then
            echo "ERROR: auditor tests passed with the noindex check disabled"
            exit 1
          else
            echo "OK: auditor tests catch a broken check"
          fi

      - name: Negative self-test (renamed heading must break the auditor's anchors)
        run: |
          set -eu
          cp -R . /tmp/anchor-copy && mkdir -p /tmp/anchor-copy-residue
          python3 - <<'PY'
          import re
          p = '/tmp/anchor-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/references/architecture-and-equity.md'
          s = open(p, encoding="utf-8").read()
          s2, n = re.subn('^## Read-budget: navigation now costs you twice$', '## Read budget', s, count=1, flags=re.M)
          assert n == 1, "PLANT DID NOT LAND: pattern not found in " + p
          open(p, "w", encoding="utf-8").write(s2)
          PY
          if TMPDIR=/tmp/anchor-copy-residue python3 /tmp/anchor-copy/test/validate.py; then
            echo "ERROR: validator passed while page_audit.py points at a renamed heading"
            exit 1
          else
            echo "OK: validator catches a dangling finding anchor"
          fi

      - name: Negative self-test (bytecode in the shipped tree must fail)
        run: |
          set -eu
          cp -R . /tmp/pyc-copy && mkdir -p /tmp/pyc-copy-residue
          mkdir -p /tmp/pyc-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/__pycache__
          touch /tmp/pyc-copy/plugins/seo-aeo-audit/skills/seo-aeo-audit/scripts/__pycache__/x.cpython-312.pyc
          if TMPDIR=/tmp/pyc-copy-residue python3 /tmp/pyc-copy/test/validate.py; then
            echo "ERROR: validator passed with __pycache__ inside plugins/ — v0.7.0 shipped exactly that"
            exit 1
          else
            echo "OK: validator refuses build artifacts in the shipped tree"
          fi

      - name: Negative self-test (template drift must fail)
        run: |
          set -eu
          cp -R . /tmp/drift-copy && mkdir -p /tmp/drift-copy-residue
          printf '\n## injected drift\n' >> /tmp/drift-copy/templates/audit-report.template.md
          if TMPDIR=/tmp/drift-copy-residue python3 /tmp/drift-copy/test/validate.py; then
            echo "ERROR: validator passed with the root template drifted from the shipped copy"
            exit 1
          else
            echo "OK: validator catches template drift"
          fi

      - name: Negative self-tests for the reconciliation guards
        run: |
          set -eu
          S=plugins/seo-aeo-audit/skills/seo-aeo-audit
          # Each row plants one defect the guard exists for and requires a non-zero
          # exit. A guard nobody has watched fail is indistinguishable from a guard
          # that cannot — and the 2026-08-10 audit found guards written against one
          # home of a fact that lived in four, all of them green.
          plant() {
            desc="$1"; shift
            rm -rf /tmp/neg /tmp/neg-residue && cp -R . /tmp/neg && mkdir -p /tmp/neg-residue
            python3 test/plant_guard.py snap /tmp/neg
            ( cd /tmp/neg && "$@" )
            # Instruction #6's corollary, once for every call site. The comparison is
            # `test/plant_guard.py`, not an inline `diff`: five hand-written variants of
            # this check produced five different bugs, one of them a content-only
            # comparison against a plant whose whole effect is `chmod`.
            python3 test/plant_guard.py verify /tmp/neg "$desc"
            if TMPDIR=/tmp/neg-residue python3 /tmp/neg/test/validate.py >/dev/null 2>&1; then
              echo "BROKEN GUARD: $desc — validator still passes"; exit 1
            fi
            echo "ok: $desc"
          }
          # `plant` asks only "does the validator now fail". That is not enough for a
          # plant that edits a DOCUMENT: this workflow's own anchor-liveness guard
          # notices that the literal a plant substitutes is no longer in the file, so
          # every literal-anchored document plant makes the validator fail for a second
          # reason whether its own guard works or not. Measured 2026-08-20: the
          # run-stamp plant lowered one stamp of several, its guard (which takes the
          # newest) correctly did not fire, and `plant` reported ok. `plantq` requires
          # the refusal to NAME the defect. The 39 older calls are left on `plant` and
          # the weakness is filed as B-33 rather than left implicit.
          plantq() {
            desc="$1"; needle="$2"; shift 2
            rm -rf /tmp/neg /tmp/neg-residue && cp -R . /tmp/neg && mkdir -p /tmp/neg-residue
            python3 test/plant_guard.py snap /tmp/neg
            ( cd /tmp/neg && "$@" )
            python3 test/plant_guard.py verify /tmp/neg "$desc"
            if out=$( cd /tmp/neg && TMPDIR=/tmp/neg-residue python3 test/validate.py 2>&1 ); then
              echo "BROKEN GUARD: $desc — validator still passes"; exit 1
            fi
            if ! printf '%s' "$out" | grep -qF "$needle"; then
              echo "BROKEN GUARD: $desc — the validator failed and never named it."
              echo "  expected to see: $needle"
              printf '%s\n' "$out" | head -25
              exit 1
            fi
            echo "ok: $desc"
          }
          # These two plants name the current myth count, which makes this file a
          # fifth home for it beside myths.md, README, SKILL.md and the Cursor
          # rule. Adding row 33 in v0.19.0 stopped both plants landing, and
          # plant_guard refused rather than reporting a pass — which is the guard
          # working, and also the reminder: bump the numbers here in the same
          # commit that adds a myth row.
          plant "myth count drifting in SKILL.md (not the README home)" \
            python3 test/plant_edit.py sub "$S/SKILL.md" "most-requested of the **33**" "most-requested of the **30**"
          plant "myth count drifting in the Cursor channel" \
            python3 test/plant_edit.py sub cursor/rules/seo-aeo-audit.mdc "out of 33 refuted claims" "out of 29 refuted claims"
          plant "the two myth short lists disagreeing in size" \
            python3 -c "p='cursor/rules/seo-aeo-audit.mdc';s=open(p,encoding='utf-8').read();assert 'The fourteen asked for most often' in s,'PLANT DID NOT LAND: '+p;open(p,'w',encoding='utf-8').write(s.replace('The fourteen asked for most often','The thirteen asked for most often',1))"
          plant "play count drifting from the table" \
            python3 test/plant_edit.py sub README.md "| **Growth plays** | 61 plays" "| **Growth plays** | 60 plays"
          plant "the Prowl tool count disagreeing across homes" \
            python3 test/plant_edit.py sub README.md "~448 provider tools" "~408 provider tools"
          plant "a table row with more cells than its header" \
            python3 -c "import re,io;p='plugins/seo-aeo-audit/skills/seo-aeo-audit/references/growth-plays.md';s=open(p,encoding='utf-8').read();s2,n=re.subn('^| B1 | Manual action present |','| B1 | Manual action present | extra |',s,count=1,flags=re.M);assert n==1,'PLANT DID NOT LAND: '+p;open(p,'w',encoding='utf-8').write(s2)"
          plant "CONTRIBUTING naming a subset of the gate" \
            python3 test/plant_edit.py delline CONTRIBUTING.md "python3 test/test_collectors.py"
          plant "a section id defined in two references" \
            python3 test/plant_edit.py sub "$S/references/onpage-checks.md" "## O1. Can crawlers" "## D1. Can crawlers"
          plant "a row appended without moving the newest-row line" \
            python3 -c "import re;p='plugins/seo-aeo-audit/skills/seo-aeo-audit/references/algorithm-updates.md';s=open(p,encoding='utf-8').read();s2,n=re.subn(r'(\*\*Newest row in this file:\s*)20\d\d-\d\d-\d\d',r'\g<1>2000-01-01',s,count=1);assert n==1,'PLANT DID NOT LAND: '+p;open(p,'w',encoding='utf-8').write(s2)"
          plant "a finding emitted with no evidence tier" \
            python3 test/plant_edit.py sub "$S/scripts/page_audit.py" '    "truncated-read": "CONFIRMED",' ""
          plant "the CWV thresholds drifting from their documented home" \
            python3 test/plant_edit.py sub "$S/scripts/psi_pull.py" '("LCP", 2500, 4000' '("LCP", 2000, 4000'
          plant "a backticked references/ pointer resolving to nothing" \
            python3 test/plant_edit.py sub "$S/references/linkbuilding.md" '`references/myths.md`' '`references/mythz.md`'
          plant "a prose reference count going stale" \
            python3 -c "import re;p='CONTRIBUTING.md';s=open(p,encoding='utf-8').read();s2,n=re.subn(r'(mostly \*\*knowledge\*\* — )[a-z-]+',r'\g<1>two',s,count=1);assert n==1,'PLANT DID NOT LAND: '+p;open(p,'w',encoding='utf-8').write(s2)"
          plant "the slash command losing a non-negotiable" \
            python3 test/plant_edit.py truncate plugins/seo-aeo-audit/commands/seo-aeo-audit.md "8. **Know each instrument"
          # The coverage vocabulary. Three of these edit BOTH skeleton homes in one
          # command, deliberately: change one and the template-drift guard fires
          # instead, which would prove a different guard works. The first attempt at
          # them used `open(p,'w').write(open(p).read().replace(...))` — python
          # truncates the target before it evaluates the argument, so the plant
          # emptied the file and the guard reported "no Track coverage section". It
          # landed, plant_guard was satisfied, and the evidence was worthless. That
          # is why plant_edit.py exists, and why every plant's failure message is
          # read rather than counted.
          SKEL='templates/audit-report.template.md plugins/seo-aeo-audit/skills/seo-aeo-audit/references/deliverable-templates.md'
          plant "a coverage status outside the closed vocabulary" \
            bash -c 'for f in '"$SKEL"'; do python3 test/plant_edit.py sub "$f" "| E content value | unlooked |" "| E content value | checked |"; done'
          plant "the coverage table one row short of the tracks SKILL.md declares" \
            bash -c 'for f in '"$SKEL"'; do python3 test/plant_edit.py delline "$f" "| K agent surface | unlooked | |"; done'
          plant "a blank Status cell — the defect this vocabulary replaced" \
            bash -c 'for f in '"$SKEL"'; do python3 test/plant_edit.py sub "$f" "| E content value | unlooked |" "| E content value |  |"; done'
          plant "a probe emitting a gate COVERAGE_GATES does not declare" \
            python3 test/plant_edit.py sub "$S/scripts/preflight.py" '"network", "unattempted", "http",' '"network", "http",'
          # The same defect one indirection away, and it is the one that was silently
          # passing: check_gsc classifies into a local `gate` before calling probe(),
          # so a guard reading only probe()'s arguments left this green while the
          # probe still emitted the gate a coverage row would then be refused for.
          plant "a gate emitted through a variable, undeclared" \
            python3 test/plant_edit.py sub "$S/scripts/preflight.py" '"api-not-enabled", "permission", "network",' '"permission", "network",'
          plant "a track declared in SKILL.md and absent from preflight's TRACKS" \
            python3 test/plant_edit.py delline "$S/scripts/preflight.py" '    ("K", "agent surface"),'
          plant "a track with no TRACK_SOURCES entry, which can never read blocked-by" \
            python3 test/plant_edit.py delline "$S/scripts/preflight.py" '    "K": ("robots.txt", "homepage"),'
          # Provenance (SE-02). The producer block is COPIED into all seven scripts
          # rather than imported — the installed layout has nothing to import from —
          # so the plants below break the copy, the call, the version literal and both
          # skeleton homes in turn. Five more, whose checker is the behaviour suite
          # rather than the validator, live in the next step.
          plant "a script emitting a payload with no producer block" \
            python3 test/plant_edit.py sub "$S/scripts/sitemap_audit.py" 'prov = provenance("sitemap_audit.py", argv,' 'prov = dict(argv=argv,  # noqa'
          plant "the provenance shared block missing from one script" \
            python3 test/plant_edit.py truncate "$S/scripts/psi_pull.py" '# ── provenance: the execution that produced this payload ── shared block ──────'
          plant "a script carrying the block and never calling it under its own name" \
            python3 test/plant_edit.py sub "$S/scripts/agent_surface.py" 'prov = provenance("agent_surface.py", argv,' 'prov = provenance("preflight.py", argv,'
          # The whole reason seven copies are compared byte for byte: one edited copy
          # is seven versions of one function, and six of them keep passing.
          plant "the shared block edited in one copy only" \
            python3 test/plant_edit.py sub "$S/scripts/gsc_pull.py" 'SECRET_FLAGS = ("--key",)' 'SECRET_FLAGS = ()'
          plant "observed_at dropped from the closed field set" \
            bash -c 'for f in '"$S"'/scripts/*.py; do python3 test/plant_edit.py sub "$f" "PRODUCER_FIELDS = (\"skill\", \"script\", \"observed_at\", \"runtime\", \"args\", \"scope\"," "PRODUCER_FIELDS = (\"skill\", \"script\", \"runtime\", \"args\", \"scope\","; done'
          # Seven more homes for one semver. Literals rather than a runtime lookup
          # because `bin/seo-aeo-audit.js` installs `scripts/` with no manifest beside
          # it — so a producer block naming a version that never ran is the risk, and
          # this is what refuses it. Bump all seven with the manifests.
          # The version is READ from package.json, not written here. Hard-coding it made
          # this plant a release blocker: v0.23.0 bumped the seven literals, the plant
          # could no longer find "0.22.0", and it refused with PLANT DID NOT LAND — the
          # second-order guard working exactly as designed, on the release itself. A
          # plant anchored on a value that moves describes the tree it was written
          # against; anchor on where the value lives instead.
          V="$(python3 -c 'import json;print(json.load(open("package.json"))["version"])')"
          plant "a SKILL_VERSION literal drifting from the manifests" \
            bash -c 'for f in '"$S"'/scripts/*.py; do python3 test/plant_edit.py sub "$f" "SKILL_VERSION = \"'"$V"'\"" "SKILL_VERSION = \"0.0.1-drift\""; done'
          # Both skeletons in one command, as the coverage plants do: change one and
          # the template-drift guard fires instead, proving a different guard works.
          plant "a skeleton losing the command that seeds the block" \
            bash -c 'for f in '"$SKEL"'; do python3 test/plant_edit.py sub "$f" "  --format provenance" "  --format json"; done'
          plant "a skeleton losing an invalidator" \
            bash -c 'for f in '"$SKEL"'; do python3 test/plant_edit.py delline "$f" "| **policy** | a core or AI-surface update changed the rules the evidence was read under |"; done'
          plant "a skeleton no longer naming every producer field" \
            bash -c 'for f in '"$SKEL"'; do python3 test/plant_edit.py sub "$f" "\`args\` · \`scope\` · \`actor\` · \`model\` · \`trace\`" "\`args\` · \`actor\` · \`model\` · \`trace\`"; done'
          # B-25 (this comment said B-17 until 2026-08-20 — an open row about a
          # different defect). Two numbers in SECURITY.md that a reader consults
          # *because* they will not read the code, and that said six/22 against
          # seven/26 for four releases.
          plant "SECURITY.md's script count going stale" \
            python3 test/plant_edit.py sub SECURITY.md 'documentation plus **seven** small Python scripts' 'documentation plus **six** small Python scripts'
          plant "SECURITY.md's I/O line count going stale" \
            python3 test/plant_edit.py sub SECURITY.md 'prints **33 lines and that is all of it**' 'prints **22 lines and that is all of it**'
          plant "a script with no row in SECURITY.md's I/O table" \
            python3 test/plant_edit.py delline SECURITY.md '| `agent_surface.py` | the origin, API host, page and OpenAPI URL **you** pass | no | no |'
          # The regex is read out of SECURITY.md and RUN, so narrowing the published
          # pattern breaks the count it claims — a guard with its own copy of the
          # pattern would only prove its copy agrees with itself.
          plant "the published I/O regex narrowed away from its own count" \
            python3 test/plant_edit.py sub SECURITY.md 'socket|os\.environ|os\.system' 'socket|os\.system'
          # ── the evidence documents, one plant per family ────────────────────
          # Eleven documented facts were false on 2026-08-20 with the gate green. Each
          # guard below was watched failing on the real tree BEFORE its plant existed —
          # that is the order standing instruction #2 asks for — and each plant restores
          # the exact wording that shipped, so the plant is the defect and not a
          # caricature of it. `plantq`, not `plant`: the refusal has to name the defect.
          # The needle is SINGLE-quoted, because half of these messages carry the
          # backticked name of a file and a double-quoted needle hands it to the shell.
          plantq "the script count going stale in the README's security posture" 'the security-posture sentence says' \
            python3 test/plant_edit.py sub README.md 'Text plus **seven** standard-library' 'Text plus **six** standard-library'
          plantq "a shipped script the README's security posture does not name" 'does not name `agent_surface.py`' \
            python3 test/plant_edit.py sub README.md '`sitemap_audit.py`, `agent_surface.py`)' '`sitemap_audit.py`)'
          plantq "the script count going stale in CLAUDE.md" 'the opening description says' \
            python3 test/plant_edit.py sub CLAUDE.md 'knowledge plus seven standard-library scripts' 'knowledge plus six standard-library scripts'
          plantq "CLAUDE.md naming a subset of the gate" 'CLAUDE.md does not mention `test/plant_guard_test.py`' \
            python3 test/plant_edit.py sub CLAUDE.md '`test/plant_guard_test.py`,' ''
          plantq "DOCMAP's gate block naming a subset of the gate" 'docs/DOCMAP.md does not mention `test/test_agent_surface.py`' \
            python3 test/plant_edit.py delline docs/DOCMAP.md 'python3 test/test_agent_surface.py'
          plantq "DOCMAP counting the gate's homes wrong" 'the single-home row says the gate commands have' \
            python3 test/plant_edit.py sub docs/DOCMAP.md 'appear in all six of them' 'appear in all five of them'
          plantq "DOCMAP's _flat copy count drifting from the scripts" 'scripts define one; measured' \
            python3 test/plant_edit.py sub docs/DOCMAP.md '`_flat()` — five of the seven scripts define one' '`_flat()` — seven of the seven scripts define one'
          plantq "the README's freshness stamp drifting from the reference that owns it" 'says the sources were last re-fetched' \
            python3 test/plant_edit.py sub README.md '**Sources last re-fetched 2026-08-16**' '**Sources last re-fetched 2026-08-10**'
          plantq "the README's corpus size restated instead of counted" 'non-blank lines of reference material' \
            python3 test/plant_edit.py sub README.md '**~5,900 non-blank lines**' '**~5,000 non-blank lines**'
          plantq "a SKILL.md body over the 5000-token budget" 'the budget is < 5000' \
            python3 -c "p='plugins/seo-aeo-audit/skills/seo-aeo-audit/SKILL.md';s=open(p,encoding='utf-8').read();a='## Step 3 — Triage';assert a in s,'PLANT DID NOT LAND: '+a;open(p,'w',encoding='utf-8').write(s.replace(a,'<!-- '+('budget '*900)+'-->'+chr(10)+chr(10)+a,1))"
          plantq "prose calling an OPEN board row closed" 'calls B-17 closed' \
            python3 test/plant_edit.py sub SECURITY.md '(B-25, closed in v0.23.0)' '(B-17, closed 2026-08-19)'
          plantq "a board id that resolves to no row" 'cites B-99 and the board has no such row' \
            python3 test/plant_edit.py sub SECURITY.md '(B-25, closed in v0.23.0)' '(B-99, closed in v0.23.0)'
          plantq "the newest release with no verification-ledger section" 'section, and that is CHANGELOG.md' \
            python3 test/plant_newest_section.py
          plantq "a release missing from the declared unrecorded list" 'the declared unrecorded-release list disagrees' \
            python3 test/plant_edit.py delline docs/evidence/verification.md '- `v0.18.0`'
          plantq "the unrecorded-release count restated instead of counted" 'releases are unrecorded; measured' \
            python3 test/plant_edit.py resub docs/evidence/verification.md '\*\*[A-Z][a-z]+\*\* of the [a-z-]+ releases' '**Fifteen** of the twenty-one releases'
          plantq "a ledger tally disagreeing with its own Confirmed column" 'and its rows give' \
            python3 test/plant_edit.py sub docs/evidence/verification.md '21 rows — 5 observed · 6 test-only · 4 planted+observed · 1 planted · 5 never' '22 rows — 5 observed · 6 test-only · 5 planted+observed · 6 never'
          plantq "a ledger section with rows and no tally at all" 'no tally is a tally nobody can check' \
            python3 test/plant_edit.py sub docs/evidence/verification.md '**Counts, by parsing the table above: 12 rows — 4 observed' 'Counts, by parsing the table above: 12 rows — 4 observed'
          plantq "run stamps falling behind the shipped version" 'newest run stamp is v' \
            python3 test/plant_edit.py resub docs/evidence/retro.md '\*\*[0-9]{4}-[0-9]{2}-[0-9]{2} \(`v[0-9.]+`\)\*\*\s*$' '**2026-08-20 (`v0.14.1`)**'
          plantq "the prune log's instruction count drifting from the headings" 'last prune entry says the list stands at' \
            python3 test/plant_edit.py sub docs/evidence/retro.md 'so the list stands at **ten** — exactly the cap' 'so the list stands at **eleven** — one over the cap'

      - name: Negative self-tests for the provenance behaviour contracts
        run: |
          set -eu
          S=plugins/seo-aeo-audit/skills/seo-aeo-audit
          # Same harness as the step above with the checker as a parameter: these five
          # defects are BEHAVIOUR — a guessed field, an echoed credential, a block that
          # never reaches markdown — and the structural validator cannot see any of
          # them. The comparison is still `plant_guard.py`, which is the part that had
          # five hand-written variants and five bugs.
          plant() {
            desc="$1"; checker="$2"; shift 2
            rm -rf /tmp/negb /tmp/negb-residue && cp -R . /tmp/negb && mkdir -p /tmp/negb-residue
            python3 test/plant_guard.py snap /tmp/negb
            ( cd /tmp/negb && "$@" )
            python3 test/plant_guard.py verify /tmp/negb "$desc"
            if ( cd /tmp/negb && TMPDIR=/tmp/negb-residue python3 "$checker" >/dev/null 2>&1 ); then
              echo "BROKEN GUARD: $desc — $checker still passes"; exit 1
            fi
            echo "ok: $desc"
          }
          C=test/test_output_contracts.py
          # `observed_at` is the field the whole row turns on: without it a report
          # cannot say whether it has expired, and a three-month-old audit reads like
          # today's. Both plants hit the seventh copy of the shared block — preflight's
          # — because a single-copy edit is what the byte comparison one step up
          # catches, and this step is measuring something else.
          plant "a producer block with no observed_at" "$C" \
            bash -c 'python3 test/plant_edit.py sub '"$S"'/scripts/preflight.py "\"observed_at\": time.strftime(\"%Y-%m-%dT%H:%M:%SZ\", time.gmtime())," "" 7'
          plant "observed_at written as free text" "$C" \
            bash -c 'python3 test/plant_edit.py sub '"$S"'/scripts/preflight.py "time.strftime(\"%Y-%m-%dT%H:%M:%SZ\", time.gmtime())" "\"recently\"" 7'
          # The manifesto asks for provenance that can be investigated, not for a field
          # filled in to look complete. A guessed `model` is the worst case: the wrong
          # vendor id sends an investigation to a model that never ran.
          plant "a harness-owned field guessed instead of reported unavailable" "$C" \
            bash -c 'for f in '"$S"'/scripts/*.py; do python3 test/plant_edit.py sub "$f" "out[_name] = _val or f\"unavailable: {_var} is not set by this harness ({_what})\"" "out[_name] = _val or \"a-model-nobody-ran\""; done'
          plant "a --key value echoed into the producer block" "$C" \
            bash -c 'for f in '"$S"'/scripts/*.py; do python3 test/plant_edit.py sub "$f" "\"args\": redact(argv)," "\"args\": list(argv),"; done'
          # Watched under-reporting before it was trusted: asserting `provenance_md`
          # EXISTS left this green when the print was deleted from a renderer, because
          # nothing ran a default-format main() and read its output. Now every
          # collector is driven through both formats.
          plant "the producer block dropped from one renderer's default format" "$C" \
            python3 test/plant_edit.py delline "$S/scripts/psi_pull.py" '        print("\n" + provenance_md(prov))'
          # gsc_pull had three `return 0`s and no `return 1`: a property that answered
          # zero rows for every dimension rendered a report finding no cliff, no
          # cannibalization and no CTR gap, and exited success. The renderer and the
          # status read one predicate, so both plants below break both at once.
          plant "a gsc_pull run that measured nothing exiting 0" "$C" \
            bash -c 'python3 test/plant_edit.py sub '"$S"'/scripts/gsc_pull.py "    rc = 0 if measured_rows(report) else 1" "    rc = 0"'
          plant "the nothing-measured banner dropped from the gsc_pull report" "$C" \
            python3 test/plant_edit.py sub "$S/scripts/gsc_pull.py" '"NOTHING MEASURED — the API answered zero rows for every dimension "' '"the API answered zero rows for every dimension "' 

          # ── the residue ledger: a leak, and a silence about it ───────────────
          # `test/plant_guard_test.py:34` built one tree per case and removed none;
          # 2560 trees of that shape were on this machine when the count was taken.
          # The first plant restores the leak, the second the silence — a clean run
          # that says nothing is how the next leak becomes invisible again.
          R=test/residue_test.py
          plant "a suite that leaks its temp trees again" "$R" \
            python3 test/plant_edit.py sub test/plant_guard_test.py 'd = residue.workspace("plant-guard")' 'import tempfile; d = tempfile.mkdtemp()'
          plant "a passing case whose tree is kept anyway" "$R" \
            python3 test/plant_edit.py sub test/residue.py '        if _keep(owner):' '        if True:'
          plant "the residue line dropped from a clean run" "$R" \
            python3 test/plant_edit.py sub test/residue.py '    if not kept:' '    if kept and False:'

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: npm installer CLI check
        run: node --check bin/seo-aeo-audit.js

      - name: npm installer functional test (fresh / rerun-skip / --force)
        run: |
          set -eu
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          node bin/seo-aeo-audit.js
          test -f "$HOME/.claude/skills/seo-aeo-audit/SKILL.md"
          test -f "$HOME/.claude/skills/seo-aeo-audit/references/myths.md"
          test -f "$HOME/.claude/skills/seo-aeo-audit/references/deliverable-templates.md"
          test -f "$HOME/.claude/skills/seo-aeo-audit/scripts/page_audit.py"
          test -f "$HOME/.claude/commands/seo-aeo-audit.md"
          node bin/seo-aeo-audit.js | grep -q '^skip:'
          node bin/seo-aeo-audit.js --force | grep -q '^Installed'
          if node bin/seo-aeo-audit.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          echo "OK: npm installer behaves"

      - name: Workflow YAML parses
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/validate.yml')); print('workflow parses OK')"
      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          # The repo's own validator enforces house rules; this one is the
          # upstream spec. --strict fails on unrecognized manifest fields and on
          # front matter that silently drops at runtime -- both were real here.
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/seo-aeo-audit --strict
